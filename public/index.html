<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Downloader</title>
  <link rel="stylesheet" href="styles.css">
<style>.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}</style></head>
<body>
  <div class="container">
    <h1>Media Downloader</h1>
    <div class="download-form">
      <input type="text" id="url" placeholder="Enter media URL">
      <input type="text" id="category" placeholder="Enter category">
      <button onclick="downloadMedia()">Download</button>
    </div>
    <div class="media-list">
      <h2>Media List</h2>
      <ul id="mediaList"></ul>
    </div>
  </div>
  
  <script src="script.js"></script>
<img class="paf-made-by" src="/made-by.png" alt="Made with App Builder — Pi SoloHost"></body>
</html>
